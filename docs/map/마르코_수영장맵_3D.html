<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마르코! 심야 실내수영장 맵 3D (v1.1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e7eff1; --panel:rgba(250,252,252,.9); --panel-solid:#fafcfc; --ink:#13222b; --muted:#56666e;
  --line:rgba(19,34,43,.14); --accent:#d8392f; --aqua:#167fa3; --chip:#eef3f4; --chip-on:#13222b; --chip-on-ink:#f4f8f9;
  --shadow:0 10px 30px rgba(10,30,40,.16);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1114; --panel:rgba(14,19,22,.9); --panel-solid:#0e1316; --ink:#e4eef1; --muted:#93a5ac;
    --line:rgba(228,238,241,.14); --accent:#ff6a5c; --aqua:#35f0d0; --chip:#1a2328; --chip-on:#e4eef1; --chip-on-ink:#0e1316;
    --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0c1114; --panel:rgba(14,19,22,.9); --panel-solid:#0e1316; --ink:#e4eef1; --muted:#93a5ac;
  --line:rgba(228,238,241,.14); --accent:#ff6a5c; --aqua:#35f0d0; --chip:#1a2328; --chip-on:#e4eef1; --chip-on-ink:#0e1316;
  --shadow:0 10px 30px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.zl{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-weight:600;font-size:13px;
  padding:3px 9px;border-radius:999px;background:var(--panel-solid);color:var(--ink);border:1px solid var(--line);
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.zl.f2{border-color:#8a74d6}
.ml{position:absolute;transform:translate(-50%,-130%);white-space:nowrap;font-size:11.5px;font-weight:600;
  padding:1px 7px;border-radius:6px;color:#fff}
.panel{position:fixed;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
#ctrl{left:calc(14px + env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));width:300px;
  max-height:calc(100% - 28px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;padding:16px 16px 14px}
#ctrl h1{font-size:19px;line-height:1.25;margin:0 0 2px;font-weight:700;letter-spacing:-.01em}
#ctrl .sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.grp{margin:12px 0 0}
.grp>.t{font-size:12.5px;color:var(--muted);margin:0 0 6px;font-weight:500}
.seg{display:flex;gap:4px;background:var(--chip);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:13px;font-weight:500;
  padding:7px 4px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
button:focus-visible,select:focus-visible,input:focus-visible,.zrow:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0}
.row label{font-size:13.5px}
input[type=range]{width:100%;accent-color:var(--accent)}
.sw{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:999px;background:var(--chip);
  border:1px solid var(--line);position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted)}
.sw:checked{background:var(--accent);border-color:var(--accent)}
.sw:checked::after{transform:translateX(16px);background:#fff}
select{width:100%;font:inherit;font-size:13.5px;padding:7px 8px;border-radius:9px;border:1px solid var(--line);background:var(--panel-solid);color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--panel-solid);color:var(--ink);font:inherit;font-size:13px;font-weight:500;
  padding:7px 10px;border-radius:9px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.hintbox{margin-top:12px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.hintbox b{color:var(--ink);font-weight:600}
#info{right:calc(14px + env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));width:310px;padding:16px;display:none;
  max-height:calc(100% - 28px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto}
#info.on{display:block}
#info h2{margin:0;font-size:20px;line-height:1.3}
#info .meta{color:var(--muted);font-size:12.5px;margin:2px 0 10px}
#info p{margin:0 0 12px;font-size:13.5px}
#info h3{font-size:12.5px;color:var(--muted);font-weight:500;margin:12px 0 6px}
#info ul{list-style:none;margin:0;padding:0}
#info li{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13.5px}
#info li:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.tag{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
#info .close{position:absolute;top:10px;right:10px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:4px 8px}
#legend{left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:10px 12px;width:300px}
#legend summary{cursor:pointer;font-weight:600;font-size:13px;list-style:none}
#legend summary::-webkit-details-marker{display:none}
#legend .lg{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:8px;font-size:12.5px}
#legend .lg span{display:flex;align-items:center;gap:6px}
#legend .sq{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);flex:none}
#zonebar{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:8px 16px;
  font-weight:600;font-size:15px;display:none;text-align:center;pointer-events:none}
#zonebar small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
#prompt{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:9px 16px;font-weight:600;display:none}
#tip{position:fixed;pointer-events:none;padding:5px 10px;font-size:12.5px;font-weight:600;display:none;border-radius:8px}
#mini{right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:8px;display:none}
#mini canvas{display:block;border-radius:8px;cursor:crosshair}
#mini .cap{font-size:12px;color:var(--muted);margin:0 2px 6px;display:flex;justify-content:space-between}
#walkhelp{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:8px 14px;font-size:12.5px;color:var(--muted);display:none;text-align:center}
#walkhelp b{color:var(--ink)}
#pad{position:fixed;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));display:none;
  grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:6px}
#pad button{border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:20px;touch-action:none}
#pad .up{grid-column:2;grid-row:1}#pad .lt{grid-column:1;grid-row:2}#pad .rt{grid-column:3;grid-row:2}#pad .dn{grid-column:2;grid-row:3}
#pad .st{grid-column:2;grid-row:2;font-size:13px;font-weight:600}
#menuBtn{display:none;position:fixed;left:calc(14px + env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));
  padding:9px 14px;font-weight:600;z-index:3}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--muted)}
@media (max-width:700px){
  #ctrl{width:calc(100% - 28px);display:none;z-index:4}
  #ctrl.open{display:block}
  #menuBtn{display:block}
  #legend{display:none}
  #info{width:calc(100% - 28px);top:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-height:50%}
  .zl{font-size:12px}
}
</style>
</head>
<body>
<div id="loading">3D 맵을 불러오는 중입니다</div>
<div id="stage"></div>
<div id="labels" aria-hidden="true"></div>

<button id="menuBtn" class="panel btn" aria-expanded="false" aria-controls="ctrl">설정 열기</button>
<section id="ctrl" class="panel" aria-label="보기 설정">
  <h1>심야 실내수영장</h1>
  <p class="sub">마르코! 맵설계 v1.1 · 1칸 = 1m</p>

  <div class="grp"><p class="t">보는 방식</p>
    <div class="seg" role="group" aria-label="보는 방식">
      <button id="mOrbit" aria-pressed="true">위에서 둘러보기</button>
      <button id="mWalk" aria-pressed="false">걸어서 보기</button>
    </div></div>

  <div class="grp orbit-only"><p class="t">층</p>
    <div class="seg" role="group" aria-label="층 선택">
      <button data-fl="1" aria-pressed="false">1층</button>
      <button data-fl="2" aria-pressed="false">2층</button>
      <button data-fl="all" aria-pressed="true">전체</button>
      <button data-fl="ex" aria-pressed="false">분해</button>
    </div></div>

  <div class="grp orbit-only"><p class="t">벽 높이 (낮추면 방 안이 보입니다)</p>
    <input id="cut" type="range" min="0" max="100" value="22" aria-label="벽 높이"></div>

  <div class="grp">
    <div class="row"><label for="tZone">방 이름</label><input id="tZone" class="sw" type="checkbox" checked></div>
    <div class="row"><label for="tObj">밸브 · 출구 · 아이템</label><input id="tObj" class="sw" type="checkbox" checked></div>
    <div class="row"><label for="tNight">게임 화면처럼 보기 (어둠 + 발광선)</label><input id="tNight" class="sw" type="checkbox"></div>
  </div>

  <div class="grp"><p class="t">구역으로 이동</p>
    <select id="zsel" aria-label="구역으로 이동"></select></div>

  <div class="grp" style="display:flex;gap:6px"><button class="btn" id="reset">처음 시점으로</button></div>

  <div class="hintbox" id="orbitHint"><b>둘러보기</b> 드래그로 회전, 휠로 확대, 오른쪽 드래그로 이동합니다. 바닥을 누르면 그 방의 정보와 연결된 문이 나옵니다.</div>
</section>

<aside id="info" class="panel" aria-live="polite">
  <button class="close" id="infoClose" aria-label="정보 닫기">×</button>
  <div id="infoBody"></div>
</aside>

<details id="legend" class="panel">
  <summary>범례</summary>
  <div class="lg" id="lg"></div>
</details>

<div id="zonebar" class="panel"></div>
<div id="prompt" class="panel"></div>
<div id="tip" class="panel"></div>
<div id="mini" class="panel"><div class="cap"><span id="miniCap">1층 지도</span><span>누르면 이동</span></div><canvas id="miniC" width="198" height="192"></canvas></div>
<div id="walkhelp" class="panel"><b>WASD</b> 이동 · <b>Shift</b> 달리기 · <b>드래그</b> 둘러보기 · 계단 앞에서 <b>E</b> 층 이동 · <b>Esc</b> 둘러보기로</div>
<div id="pad"><button class="up" data-k="f" aria-label="앞으로">▲</button><button class="lt" data-k="l" aria-label="왼쪽으로">◀</button>
<button class="st" data-k="e" aria-label="계단 이용">E</button><button class="rt" data-k="r" aria-label="오른쪽으로">▶</button><button class="dn" data-k="b" aria-label="뒤로">▼</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

function drawMiniBg(f) {
  const c = document.createElement('canvas'); c.width = 66 * MS; c.height = 64 * MS; const x = c.getContext('2d');
  x.fillStyle = ui.night ? '#000' : '#f4f7f8'; x.fillRect(0, 0, c.width, c.height);
  for (let y = -1; y <= 62; y++) for (let gx = -1; gx <= 64; gx++) {
    const ch = at(f, gx, y); if (!ch) continue;
    let col = null;
    if (ch === '#') col = ui.night ? '#dfeff5' : '#2b2b2b';
    else if (ch === '+') col = ui.night ? '#ffb84d' : '#f39a2b';
    else if (ch === ',') col = ui.night ? '#05080a' : '#e3e9ee';
    else if (ch === '%') col = '#9aa0a6';
    else if (ch === '/') col = '#a796dc';
    else if (f === 0 && isWaterCell(0, gx, y)) col = ui.night ? '#063a44' : '#7cc3ec';
    else { const z = zoneAt(f, gx, y); col = z ? (ui.night ? '#'+nightColor(dayColor(z)).getHexString() : dayColor(z)) : '#ddd';
      if (ch === '&' || ch === 'o') col = ui.night ? '#33434a' : '#a9a39a'; }
    x.fillStyle = col; x.fillRect((gx + 1) * MS, (62 - y) * MS, MS, MS);
  }
  return c;
}
function drawMini() {
  miniBg[0] = drawMiniBg(0); miniBg[1] = drawMiniBg(1);
}
function renderMini() {
  if (ui.mode !== 'walk') return;
  mctx.drawImage(miniBg[walk.f], 0, 0);
  const px = (walk.x + 1) * MS, py = (62 - walk.y + 1) * MS - MS;
  mctx.save(); mctx.translate(px, py + MS / 2); mctx.rotate(walk.yaw);
  mctx.fillStyle = '#d8392f'; mctx.strokeStyle = '#fff'; mctx.lineWidth = 1.5;
  mctx.beginPath(); mctx.moveTo(0, -8); mctx.lineTo(5.5, 6); mctx.lineTo(0, 3); mctx.lineTo(-5.5, 6); mctx.closePath(); mctx.fill(); mctx.stroke(); mctx.restore();
  document.getElementById('miniCap').textContent = (walk.f ? '2층' : '1층') + ' 지도';
}
miniC.addEventListener('pointerdown', e => {
  const r = miniC.getBoundingClientRect(); const gx = (e.clientX - r.left) / r.width * 66 - 1, gy = 62 - ((e.clientY - r.top) / r.height * 64 - 1) + 0;
  const [x, y] = nearestWalk(walk.f, gx, gy); walk.x = x; walk.y = y;
});

// ---------- UI wiring ----------
function setFloors(v, silent) {
  ui.floors = v;
  for (const b of document.querySelectorAll('[data-fl]')) b.setAttribute('aria-pressed', b.dataset.fl === v);
  applyFloors();
}
document.querySelectorAll('[data-fl]').forEach(b => b.onclick = () => { if (ui.mode === 'walk') setMode('orbit'); setFloors(b.dataset.fl); });
document.getElementById('mOrbit').onclick = () => setMode('orbit');
document.getElementById('mWalk').onclick = () => { if (ui.mode !== 'walk') { walk.f = 0; const [x, y] = nearestWalk(0, 32.5, 6.5); walk.x = x; walk.y = y; walk.yaw = 0; walk.pitch = 0; setMode('walk'); } };
document.getElementById('cut').oninput = e => { ui.cut = e.target.value / 100; updateClip(); };
document.getElementById('tZone').onchange = e => { ui.zone = e.target.checked; };
document.getElementById('tObj').onchange = e => { ui.obj = e.target.checked; for (const o of MARKER_OBJS) o.visible = ui.obj; };
document.getElementById('tNight').onchange = e => { ui.night = e.target.checked; applyTheme(); };
document.getElementById('reset').onclick = () => { setMode('orbit'); setFloors('all'); showInfo(null); };
const zsel = document.getElementById('zsel');
zsel.innerHTML = '<option value="">구역을 고르세요</option>' + [0, 1].map(f => `<optgroup label="${f ? '2층' : '1층'}">` +
  Z[f].zones.filter(z => !z.name.startsWith('구역 ')).sort((a, b) => a.name.localeCompare(b.name, 'ko')).map(z => `<option value="${f}:${z.id}">${z.name}</option>`).join('') + '</optgroup>').join('');
zsel.onchange = () => { if (!zsel.value) return; const [f, id] = zsel.value.split(':').map(Number); const z = Z[f].zones[id];
  if (ui.mode === 'walk') enterWalkAt(z); else { if (ui.floors === (f ? '1' : '2')) setFloors('all'); showInfo(z); flyTo(z); } zsel.value = ''; };
const menuBtn = document.getElementById('menuBtn'), ctrl = document.getElementById('ctrl');
menuBtn.onclick = () => { const o = ctrl.classList.toggle('open'); menuBtn.setAttribute('aria-expanded', o); menuBtn.textContent = o ? '설정 닫기' : '설정 열기'; };

// legend
const lg = document.getElementById('lg');
const LEG = [...Object.values(CATS).map(c => [c.day, c.label, 'sq']), ['#7cc3ec', '물', 'sq'], ['#f39a2b', '문', 'sq'], ['#40a669', '외부 출구 문', 'sq'], ['#7d93a1', '락커', 'sq'], ['#bcaeea', '계단', 'sq'],
  ['#d62728', '밸브', 'dot'], ['#2f9e44', '출구', 'dot'], ['#139fb6', '도망자 출발', 'dot'], ['#e8590c', '술래 출발', 'dot'], ['#e64980', '붕대', 'dot'], ['#c98f00', '찰칵이', 'dot'], ['#0b3d91', '배수구', 'dot']];
lg.innerHTML = LEG.map(([c, t, k]) => `<span><i class="${k === 'dot' ? 'dot' : 'sq'}" style="background:${c}"></i>${t}</span>`).join('');

// ---------- loop ----------
const tmpV = new THREE.Vector3();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (fly) { const t = Math.min(1, (now - fly.t0) / fly.d); const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    camera.position.lerpVectors(fly.fromP, fly.toP, e); controls.target.lerpVectors(fly.fromT, fly.toT, e); if (t >= 1) fly = null; }
  if (ui.mode === 'orbit') controls.update(); else walkStep(dt);
  if (!prefersReduced) { TEX.water.offset.x = (now / 9000) % 1; TEX.water.offset.y = (now / 13000) % 1; for (const a of ANIM) { a.o.position.y = a.b + Math.sin(now / 520 + a.b * 3) * 0.06; a.o.rotation.y = now / 1400; } }
  renderer.render(scene, camera);
  // labels
  const w = window.innerWidth, h = window.innerHeight;
  for (const L of LABELS) {
    const gVis = L.f === 0 ? g1.visible : g2.visible;
    let show = gVis && (L.marker || L.stair ? ui.obj : ui.zone);
    if (show) {
      tmpV.copy(L.p); if (L.f === 1) tmpV.y += floorOffset(1);
      if (ui.mode === 'walk') {
        const dist = tmpV.distanceTo(camera.position);
        if (dist > (L.marker ? 22 : 34)) show = false;
        if (L.f !== walk.f && !L.marker) show = false;
      } else if (L.marker && tmpV.distanceTo(camera.position) > 62) { show = false;
      } else if (ui.floors === 'all' && L.f === 0 && L.zone && L.zone !== hallZone) {
        // 1F room names under the 2F slab are hidden in combined view unless walls are cut low
        const under = at(1, Math.floor(L.zone.cx), Math.floor(L.zone.cy));
        if (under && under !== ',' && ui.cut > 0.45) show = false;
      }
      if (show) {
        tmpV.project(camera);
        if (tmpV.z > 1 || tmpV.z < -1 || Math.abs(tmpV.x) > 1.1 || Math.abs(tmpV.y) > 1.1) show = false;
        else { L.el.style.left = ((tmpV.x + 1) / 2 * w) + 'px'; L.el.style.top = ((1 - tmpV.y) / 2 * h) + 'px'; }
      }
    }
    if (L.el.style.display !== (show ? 'block' : 'none')) L.el.style.display = show ? 'block' : 'none';
  }
  renderMini();
  requestAnimationFrame(frame);
}
window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
applyFloors(); applyTheme();
document.getElementById('loading').style.display = 'none';
requestAnimationFrame(frame);
</script>
</body>
</html>
